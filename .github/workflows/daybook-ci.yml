name: DAYBOOK checks

on:
  push:
    branches: [daybook-migration]
  pull_request:
    branches: [daybook-migration]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daybook
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: daybook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daybook -d daybook"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://daybook:daybook@localhost:5432/daybook
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic tests
      - run: alembic upgrade head
      - run: alembic heads
      - run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
